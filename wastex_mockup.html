<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;}
body{margin:0;font-family:"Source Sans Pro","Source Sans 3",-apple-system,"Segoe UI",Arial,sans-serif;background:#fff;overflow:hidden;}
.phone{width:300px;max-width:calc(100% - 4px);margin:6px auto 0;border:10px solid #1f1f22;border-radius:34px;background:#fff;padding:14px 12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.appbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #e1e0d9;}
.loc{font-size:11px;color:#898781;}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 6px;}
.tab{font-size:10px;padding:3px 6px;border-radius:999px;background:#f1efe8;color:#52514e;cursor:pointer;border:0;font-family:inherit;transition:background .15s;}
.tab:hover{background:#e6e3da;} .tab.on{background:#eb6834;color:#fff;font-weight:700;}
.tab sup{font-size:7.5px;color:#898781;margin-left:2px;}
.stp{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#898781;margin:8px 0 3px;transition:color .2s;}
.stp.cur{color:#eb6834;font-weight:700;}
.lst{background:#fdeee6;border-radius:12px;padding:9px 10px;cursor:pointer;}
.row{display:flex;justify-content:space-between;align-items:flex-start;}
.lst .h{font-size:15px;font-weight:700;color:#0b0b0b;} .lst .w{font-size:11.5px;color:#52514e;margin-top:1px;}
.more{font-size:11px;color:#993C1D;white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.chip{font-size:10.5px;background:#fff;border-radius:6px;padding:2px 6px;color:#52514e;}
.spec{font-size:11px;color:#52514e;background:#fff;border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.45;}
.byr{background:#e6f1fb;border-radius:8px;padding:5px 9px;margin-top:4px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.byr.sel{border-color:#2a78d6;background:#d4e6f8;} .byr.fixed{cursor:default;}
.byr .t{display:flex;justify-content:space-between;font-size:12px;color:#0C447C;} .byr .t span{color:#52514e;}
.byr .u{font-size:10.5px;color:#52514e;margin-top:1px;}
.slots{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:#52514e;}
.slot{font-size:10.5px;padding:3px 7px;border-radius:6px;background:#f1efe8;color:#52514e;border:0;cursor:pointer;font-family:inherit;}
.slot.on{background:#0b0b0b;color:#fff;}
.btn{display:block;width:100%;background:#eb6834;color:#fff;font-weight:700;text-align:center;border-radius:10px;padding:8px;margin-top:8px;font-size:14px;border:0;cursor:pointer;font-family:inherit;transition:opacity .2s;}
.btn.blue{background:#2a78d6;} .btn.ghost{background:#f1efe8;color:#52514e;} .btn:disabled{opacity:.4;cursor:default;}
.track{display:flex;align-items:center;margin:6px 2px 2px;}
.dot{width:10px;height:10px;border-radius:50%;background:#e1e0d9;flex:none;transition:background .3s;} .dot.ok{background:#2a78d6;}
.bar{flex:1;height:2px;background:#e1e0d9;transition:background .3s;} .bar.ok{background:#2a78d6;}
.tl{display:flex;justify-content:space-between;font-size:9.5px;color:#898781;margin:2px 0 0;}
.status{background:#e6f1fb;color:#0C447C;border-radius:10px;padding:7px 10px;margin-top:6px;font-size:12px;line-height:1.35;}
.status.done{background:#e3f3e6;color:#1d6b33;}
.impact{background:#fdeee6;border-radius:10px;padding:7px 10px;margin-top:6px;font-size:11.5px;color:#52514e;line-height:1.4;}
.impact b{color:#993C1D;}
.fine{font-size:10px;color:#898781;text-align:center;margin-top:5px;}
.soon{background:#f1efe8;border-radius:12px;padding:16px 12px;margin-top:4px;text-align:center;color:#52514e;font-size:12.5px;line-height:1.5;}
.soon b{display:block;font-size:16px;color:#0b0b0b;margin-bottom:2px;}
.mocklabel{font-size:12px;color:#898781;text-align:center;margin-top:8px;}
body{overflow:auto;} .wx{max-width:820px;margin:0 auto;padding:8px 10px;}
.wx-title {font-size: 18px; font-weight: 700; color: #0b0b0b; margin: 0;}
.wx-sub {font-size: 13px; color: #898781; margin: 2px 0 4px 0;}
.wx-src {font-size: 11px; color: #898781; margin: 2px 0 0 0;}
.wx-title, .wx-sub, .wx-src {font-family: Arial, Helvetica, sans-serif;}

</style></head><body>

<div class="mocklabel">Concept mockup · tap to try</div><div class="wx" style="text-align:center"><div class="wx-src">Concept and logo: WasteX (Digital Ag Hackathon project). Listing, buyers and pickup times are illustrative; volumes are yearly averages 2014–2023 based on FAOSTAT.</div></div>
<script>
const D={"soon": {"pomace": "~29,000 t a year in Lebanon (estimate)", "oww": "~49,000 t a year in Lebanon (estimate)", "grain": "~6,000 t a year in Lebanon (estimate)", "coffee": "Volume not yet estimated"}, "solids": 0.065};
const TABS=[["whey","Whey","","Whey"],["pomace","Olive pomace","Phase 2 · olive mills · Oct–Jan","Olive pomace"],
            ["oww","Olive wastewater","Phase 2 · olive mills · Oct–Jan","Olive mill wastewater"],
            ["grain","Spent grain","Phase 3 · breweries · year-round","Brewer's spent grain"],["coffee","Coffee grounds","Later · cafés and roasters","Coffee grounds"]];
const BUYERS=[{n:"Livestock farm",km:8,t:10,u:"Liquid feed for cattle and sheep"},{n:"Feed mill",km:15,t:20,u:"Feed ingredient"},
              {n:"Biogas plant",km:27,t:20,u:"Renewable energy"}];
const SLOTS=["Today 16:00","Tomorrow 08:00","Tomorrow 14:00"], AVAIL=20;
let tab="whey",buyer=0,slot=1,stage=0,picked=false,details=false,notify={},timer=null;
function go(s){stage=s;if(s===1){picked=false;clearTimeout(timer);timer=setTimeout(()=>{picked=true;render();},1300);}render();}
function reset(){clearTimeout(timer);buyer=0;slot=1;picked=false;details=false;go(0);}
function track(){const a=[true,stage===2||picked,stage===2];
  return `<div class="track"><div class="dot ${a[0]?"ok":""}"></div><div class="bar ${a[1]?"ok":""}"></div><div class="dot ${a[1]?"ok":""}"></div>`+
         `<div class="bar ${a[2]?"ok":""}"></div><div class="dot ${a[2]?"ok":""}"></div></div><div class="tl"><span>Booked</span><span>Picked up</span><span>Delivered</span></div>`;}
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>`<button class="tab ${t[0]==tab?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}${t[2]?"<sup>soon</sup>":""}</button>`).join("");
  const b=document.getElementById("body");
  if(tab!=="whey"){const t=TABS.find(x=>x[0]==tab);
    b.innerHTML=`<div class="soon"><b>${t[3]}</b>${D.soon[tab]}<br>Coming soon · ${t[2]}</div>`+
      (notify[tab]?`<div class="status done">✓ We will notify you when ${t[3].toLowerCase()} listings open</div>`
                  :`<button class="btn ghost" onclick="notify[tab]=1;render()">Notify me</button>`);return;}
  const by=BUYERS[buyer], left=AVAIL-(stage>0?by.t:0);
  let h=`<div class="stp ${stage===0?"cur":""}">1 · List</div>`+
    `<div class="lst" onclick="if(stage===0){details=!details;render()}"><div class="row"><div><div class="h">Sweet whey, liquid</div>`+
    `<div class="w">Dairy · Bekaa · verified seller ✓</div></div><div class="more">${stage===0?(details?"Hide ▴":"Details ▾"):""}</div></div>`+
    (details&&stage===0?`<div class="spec">Lab report · 12 Nov 2026 · ${left} t left this week<br>pH 6.4 · solids 6.5% · protein 0.8% · fat 0.3%<br>Store and transport at ≤ 7 °C · collect within 24 h</div>`
      :`<div class="chips"><span class="chip">${left} t left this week</span><span class="chip">Lab-tested ✓</span><span class="chip">Collect within 24 h</span></div>`)+`</div>`;
  if(stage===0){
    h+=`<div class="stp cur">2 · Match · 3 verified buyers within 30 km</div>`+
      BUYERS.map((x,i)=>`<div class="byr ${i===buyer?"sel":""}" onclick="buyer=${i};render()"><div class="t"><b>${x.n}</b><span>${x.km} km</span></div>`+
                        (i===buyer?`<div class="u">Wants ${x.t} t a week · ${x.u}</div>`:"")+`</div>`).join("")+
      `<div class="stp">3 · Deliver</div><div class="slots">Pickup: `+
      SLOTS.map((x,i)=>`<button class="slot ${i===slot?"on":""}" onclick="slot=${i};render()">${x}</button>`).join("")+`</div>`+
      `<button class="btn" onclick="go(1)">Request pickup · ${by.t} t</button><div class="fine">Payment held by WasteX until delivery is confirmed</div>`;
  } else {
    h+=`<div class="stp">2 · Match</div><div class="byr sel fixed"><div class="t"><b>${by.n}</b><span>${by.km} km</span></div><div class="u">${by.t} t · ${by.u}</div></div>`+
       `<div class="stp cur">3 · Deliver</div>`+track();
    if(stage===1) h+=`<div class="status">Pickup ${SLOTS[slot]} · ${picked?"whey on its way":"truck assigned"}<br>Payment held until delivery is confirmed</div>`+
                     `<button class="btn blue" ${picked?"":"disabled"} onclick="go(2)">Confirm delivery</button>`;
    else h+=`<div class="status done">✓ Delivered · payment released to the dairy</div>`+
            `<div class="impact"><b>${by.t} t</b> of whey kept out of rivers · <b>${(by.t*D.solids).toFixed(2)} t</b> of dry whey Lebanon won't need to import</div>`+
            `<button class="btn ghost" onclick="reset()">Start over</button>`;
  }
  b.innerHTML=h;}
render();
